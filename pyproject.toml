[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "false-information-flagging"
version = "0.1.0"
description = "A research-first misinformation detection repository with reproducible baselines and experiment workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Repository Owner" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
deep-learning = [
  "tensorflow>=2.15",
]
transformers = [
  "transformers>=4.40",
  "datasets>=2.19",
  "accelerate>=0.30",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
