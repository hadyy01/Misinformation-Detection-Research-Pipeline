project_name: false-information-flagging
random_seed: 42
dataset:
  true_path: data/raw/True.csv
  fake_path: data/raw/Fake.csv
  text_column: text
  title_column: title
  drop_columns:
    - subject
    - date
  merge_title: true
  label_column: label
preprocessing:
  lowercase: true
  strip_html: true
  strip_urls: true
  remove_bracketed_text: true
  remove_stopwords: true
  remove_punctuation: false
split:
  test_size: 0.2
  stratify: true
model:
  family: classical
  name: logistic_regression
  tfidf:
    max_features: 40000
    min_df: 3
    ngram_range: [1, 2]
  estimator:
    C: 4.0
    max_iter: 2000
training:
  batch_size: 64
  epochs: 1
  learning_rate: 0.001
artifacts:
  output_dir: artifacts/classical_baseline

